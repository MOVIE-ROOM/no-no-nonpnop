<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOVIE ROOM - Settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="navbar">
      <div class="logo">MOVIE ROOM</div>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="#">My List</a>
        <a href="#">Account</a>
        <a href="settings.html" class="active">Settings</a>
      </div>
      <div class="profile">
        <img src="" alt="Profile">
      </div>
    </div>
  </header>
  <main class="settings-content">
    <h2>Settings</h2>
    <div class="settings-options">
      <div class="setting-item">
        <h3>Account</h3>
        <p>Manage your account details, billing, and subscriptions.</p>
        <button>Manage Account</button>
      </div>
      <div class="setting-item">
        <h3>Playback</h3>
        <p>Set your default video quality (340p to 4K) and subtitle options.</p>
        <!-- For demonstration, you could later tie this to localStorage or an API -->
        <button>Playback Settings</button>
      </div>
      <div class="setting-item">
        <h3>Profile</h3>
        <p>Update your profile information and manage profiles.</p>
        <button>Manage Profiles</button>
      </div>
    </div>
  </main>
</body>
</html>
